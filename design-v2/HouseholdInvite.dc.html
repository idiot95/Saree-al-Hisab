<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F2F5F0;color:#233D4D;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
    a{color:#3F7F6E;text-decoration:none}
    a:hover{color:#0A5049}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .t{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-0.004em}
    .el{box-shadow:0 1px 2px rgba(40,54,24,0.06),0 10px 26px -14px rgba(40,54,24,0.18)}
    .el2{box-shadow:0 2px 8px rgba(24,32,14,0.12),0 22px 44px -20px rgba(24,32,14,0.40)}
    .sec{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-0.012em;color:#233D4D}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:880px;display:flex;flex-direction:column;background:#F2F5F0">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 0">
    <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A6472"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 class="t" style="margin:0;font-size:19px">Invite someone</h1>
    <span style="width:44px;height:44px"></span>
  </div>
  <div style="display:flex;flex-direction:column;gap:11px;padding:20px 22px 22px">
    <h1 class="t" style="margin:0;font-size:33px;line-height:1.1;letter-spacing:-0.02em;text-wrap:balance">Who is joining?</h1>
    <p style="margin:0;font-size:15.5px;line-height:1.5;color:#4A6472">They get a code that works for 7 days and sign in with their own number. From then on you both see the same books.</p>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px;padding:0 20px">
    <div style="display:flex;flex-direction:column;gap:7px">
      <span class="eyebrow" style="color:#4A6472">Their phone number</span>
      <div style="display:flex;gap:10px">
        <button style="min-height:58px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:15px;background:#FFFFFF;border:1px solid #DCE5E7;font-size:16px;font-weight:600;flex:none">+91 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
        <div class="n" style="flex:1;min-height:58px;display:flex;align-items:center;padding:0 16px;border-radius:15px;background:#FFFFFF;border:1.5px solid #3F7F6E;font-size:17px;font-weight:600">98204 41213</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <span class="eyebrow" style="color:#4A6472">They join as</span>
      <button class="el" style="display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid #3F7F6E;text-align:left">
        <span style="width:24px;height:24px;border-radius:999px;background:#3F7F6E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:15.5px;font-weight:600">Adult</span>
          <span style="font-size:13px;line-height:1.45;color:#4A6472">Adds, edits and deletes anything. Cannot remove members.</span>
        </span>
      </button>
      <button class="el" style="display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
        <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid ${C.hair};display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px"></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:15.5px;font-weight:600">Viewer</span>
          <span style="font-size:13px;line-height:1.45;color:#4A6472">Reads everything, records only their own entries.</span>
        </span>
      </button>
    </div>
  </div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:24px 18px 26px">
    <button class="el2" style="width:100%;min-height:58px;border-radius:16px;background:radial-gradient(120% 100% at 25% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 60%),linear-gradient(145deg,#2C5063 0%,#1C3541 100%);color:#FFFFFF;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Send invite</button>
    <button style="width:100%;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;color:#4A6472;font-size:15px;font-weight:600"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.6"/><circle cx="17.5" cy="6" r="2.6"/><circle cx="17.5" cy="18" r="2.6"/><path d="M8.3 10.8 15.2 7.2"/><path d="M8.3 13.2l6.9 3.6"/></svg> Share a link instead</button>
  </div>
</div>
</x-dc>

class Component extends DCLogic {}

</body>
</html>
