<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0D171E;color:#EAF1F2;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
    a{color:#7FC2AF;text-decoration:none}
    a:hover{color:#0A5049}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .t{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-0.004em}
    .el{box-shadow:0 1px 2px rgba(40,54,24,0.06),0 10px 26px -14px rgba(40,54,24,0.18)}
    .el2{box-shadow:0 2px 8px rgba(24,32,14,0.12),0 22px 44px -20px rgba(24,32,14,0.40)}
    .sec{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-0.012em;color:#EAF1F2}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:900px;display:flex;flex-direction:column;background:#0D171E">

  <div class="el2" style="background:radial-gradient(130% 85% at 82% -12%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 62%),linear-gradient(150deg,#1B3341 0%,#142832 58%,#0F1E26 100%);color:#FFFFFF;border-radius:0 0 26px 26px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.86)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h1 class="t" style="margin:0;font-size:19px;color:#FFFFFF">New entry</h1>
      <span style="width:44px;height:44px"></span>
    </div>
    <div style="display:flex;gap:3px;padding:3px;background:rgba(0,0,0,0.22);border-radius:999px">
      <button style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:13.5px;font-weight:600;background:#FFFFFF;color:#EAF1F2">Expense</button>
      <button style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.86)">Income</button>
      <button style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,0.86)">Transfer</button>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="display:flex;align-items:baseline;gap:6px">
        <span class="n" style="font-size:28px;font-weight:500;color:rgba(255,255,255,0.62)">₹</span>
        <span class="n" style="font-size:46px;font-weight:600;letter-spacing:-0.036em;line-height:1.05">2,340</span>
        <span style="width:2px;height:34px;background:rgba(255,255,255,0.85);margin-left:3px;align-self:center"></span>
      </div>
      <button style="min-height:44px;padding:0 12px;display:flex;align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.22);font-size:13px;font-weight:600;color:#FFFFFF;flex:none">INR <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    </div>
  </div>

  <div class="el" style="margin:-18px 18px 12px;background:#16242D;border-radius:18px;padding:2px 16px">
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-bottom:1px solid #22343E">
      <span style="width:92px;flex:none;font-size:13.5px;font-weight:600;color:#A8BEC7">Paid to</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Big Bazaar</span>
      <span style="color:#8CA5B0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-bottom:1px solid #22343E">
      <span style="width:92px;flex:none;font-size:13.5px;font-weight:600;color:#A8BEC7">Paid using</span>
      <span style="flex:1;display:flex;align-items:center;gap:8px">
        <span style="width:26px;height:26px;border-radius:999px;background:#1A4344;display:flex;align-items:center;justify-content:center;color:#7FC2AF;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5.5 10.5v7.5"/><path d="M10 10.5v7.5"/><path d="M14 10.5v7.5"/><path d="M18.5 10.5v7.5"/><path d="M3 20.5h18"/></svg></span>
        <span style="font-size:15.5px;font-weight:600">HDFC Savings</span>
      </span>
      <span style="color:#8CA5B0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px">
      <span style="width:92px;flex:none;font-size:13.5px;font-weight:600;color:#A8BEC7">Date</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Today, 31 Aug</span>
      <span style="color:#8CA5B0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
  </div>

  <div style="display:flex;gap:8px;padding:0 18px 10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none">
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#A9D07E;color:#FFFFFF">Groceries</button>
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#49382D;color:#FBA766">Eating Out</button>
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#1B3B4F;color:#7FBCE4">Transport</button>
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#3C2D48;color:#DE93CC">Shopping</button>
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#432D3C;color:#F094A9">Children</button>
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#1A4344;color:#68D0B4">Utilities</button>
    <button style="min-height:44px;padding:0 13px;display:flex;align-items:center;gap:6px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;background:#16242D;border:1px solid #2B4049;color:#A8BEC7;font-size:13.5px;font-weight:600">All categories <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <button onClick="{{ toggleMore }}" style="margin:0 18px 12px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:1.5px dashed #3B505B;color:#7FC2AF;font-size:14.5px;font-weight:600">
    <span>{{ moreLabel }}</span>
    <span style="display:flex;transform: {{ chevronRotate }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></span>
  </button>

  <sc-if value="{{ more }}" hint-placeholder-val="{{ false }}">
    <div class="el" style="margin:0 18px 12px;background:#16242D;border-radius:18px;padding:2px 16px">
      <button onClick="{{ toggleBack }}" style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px">
        <span style="width:36px;height:36px;border-radius:999px;background:#3E3418;display:flex;align-items:center;justify-content:center;color:#FCCA46;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15px;font-weight:600">Need this money back?</span>
          <span style="font-size:12.5px;color:#A8BEC7">Reimbursement, loan or shared expense</span>
        </span>
        <sc-if value="{{ back }}" hint-placeholder-val="{{ false }}">
          <span style="width:50px;height:30px;border-radius:999px;background:#619B8A;display:flex;align-items:center;justify-content:flex-end;padding:3px;flex:none"><span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span></span>
        </sc-if>
        <sc-if value="{{ backOff }}" hint-placeholder-val="{{ true }}">
          <span style="width:50px;height:30px;border-radius:999px;background:#31454F;display:flex;align-items:center;justify-content:flex-start;padding:3px;flex:none"><span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span></span>
        </sc-if>
      </button>
      <button onClick="{{ toggleShared }}" style="border-top:1px solid #22343E;display:flex;align-items:center;gap:12px;width:100%;min-height:64px">
        <span style="width:36px;height:36px;border-radius:999px;background:#25324E;display:flex;align-items:center;justify-content:center;color:#9DA2E6;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5a6 6 0 0 1 12 0"/><path d="M16 5.6a3.2 3.2 0 0 1 0 5.8"/><path d="M17 14.2a6 6 0 0 1 4 5.3"/></svg></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15px;font-weight:600">Shared with the household</span>
          <span style="font-size:12.5px;color:#A8BEC7">Shows a Shared tag to everyone</span>
        </span>
        <sc-if value="{{ shared }}" hint-placeholder-val="{{ true }}">
          <span style="width:50px;height:30px;border-radius:999px;background:#619B8A;display:flex;align-items:center;justify-content:flex-end;padding:3px;flex:none"><span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span></span>
        </sc-if>
        <sc-if value="{{ sharedOff }}" hint-placeholder-val="{{ false }}">
          <span style="width:50px;height:30px;border-radius:999px;background:#31454F;display:flex;align-items:center;justify-content:flex-start;padding:3px;flex:none"><span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span></span>
        </sc-if>
      </button>
      <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-top:1px solid #22343E;color:#7FC2AF">
        <span style="width:92px;flex:none;font-size:13.5px;font-weight:600;color:#A8BEC7">Receipt</span>
        <span style="flex:1;font-size:15.5px;font-weight:600">Attach or scan</span>
        <span style="color:#8CA5B0"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5h3.4l1.4-2.4h8.4l1.4 2.4H21a1 1 0 0 1 1 1v8.6a1.6 1.6 0 0 1-1.6 1.6H3.6A1.6 1.6 0 0 1 2 18.1V9.5a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13.4" r="3.5"/></svg></span>
      </button>
      <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:56px;border-top:1px solid #22343E">
        <span style="width:92px;flex:none;font-size:13.5px;font-weight:600;color:#A8BEC7">Note</span>
        <span style="flex:1;font-size:15.5px;color:#7A939F">Add a note</span>
      </button>
    </div>
  </sc-if>

  <div style="margin-top:auto;padding:10px 14px 18px;background:#16242D;border-top:1px solid #2B4049;display:flex;gap:9px">
    <div style="flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">1</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">2</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">3</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">4</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">5</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">6</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">7</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">8</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">9</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">00</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">0</button>
      <button class="n" style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1A2A33;font-size:23px;font-weight:600;color:#EAF1F2">.</button>
    </div>
    <div style="width:92px;flex:none;display:flex;flex-direction:column;gap:9px">
      <button style="min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#1D2E37;color:#A8BEC7"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-9L3 12Z"/><path d="M13 9.5l4 5"/><path d="M17 9.5l-4 5"/></svg></button>
      <button class="el2" style="flex:1;min-height:169px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:14px;background:radial-gradient(120% 100% at 25% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 60%),linear-gradient(145deg,#2C5063 0%,#1C3541 100%);color:#FFFFFF;font-size:15px;font-weight:600">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>
        Save
      </button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { more: false, back: false, shared: true };
  }
  renderVals() {
    var self = this;
    return {
      more: this.state.more,
      back: this.state.back,
      backOff: !this.state.back,
      shared: this.state.shared,
      sharedOff: !this.state.shared,
      toggleShared: function () { self.setState({ shared: !self.state.shared }); },
      moreLabel: this.state.more ? 'Fewer options' : 'More options',
      chevronRotate: this.state.more ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMore: function () { self.setState({ more: !self.state.more }); },
      toggleBack: function () { self.setState({ back: !self.state.back }); }
    };
  }
}
</script>
</body>
</html>
