<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F2F5F0;color:#233D4D;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
    a{color:#3F7F6E;text-decoration:none}
    a:hover{color:#0A5049}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .t{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-0.004em}
    .el{box-shadow:0 1px 2px rgba(40,54,24,0.06),0 10px 26px -14px rgba(40,54,24,0.18)}
    .el2{box-shadow:0 2px 8px rgba(24,32,14,0.12),0 22px 44px -20px rgba(24,32,14,0.40)}
    .sec{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-0.012em;color:#233D4D}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:880px;display:flex;flex-direction:column;background:#F2F5F0">

  <div class="el2" style="background:radial-gradient(130% 85% at 82% -12%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 62%),linear-gradient(150deg,#AC4711 0%,#8A390D 58%,#682B0A 100%);color:#FFFFFF;border-radius:0 0 26px 26px;padding:18px 20px 24px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.86)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h1 class="t" style="margin:0;font-size:19px;color:#FFFFFF">Payment received</h1>
      <span style="width:44px;height:44px"></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:9px">
      <span class="eyebrow" style="color:rgba(255,255,255,0.86)">Amount received</span>
      <div style="display:flex;align-items:baseline;gap:6px">
        <span class="n" style="font-size:28px;font-weight:500;color:rgba(255,255,255,0.62)">₹</span>
        <span class="n" style="font-size:46px;font-weight:600;letter-spacing:-0.036em;line-height:1.05">12,000</span>
        <span style="width:2px;height:34px;background:rgba(255,255,255,0.85);margin-left:3px;align-self:center"></span>
      </div>
    </div>
  </div>

  <div class="el" style="margin:-16px 18px 14px;background:#FFFFFF;border-radius:18px;padding:2px 16px">
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid #EAEFF0">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">From</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Sara Iyer</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid #EAEFF0">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">Into</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">HDFC Savings</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">On</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Today, 31 Aug</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
  </div>

  <div class="el" style="margin:0 18px 14px;background:#FFFFFF;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:11px">
    <span style="font-size:14px;font-weight:600">Settles this much of what Sara owes</span>
    <div style="height:9px;border-radius:999px;background:#E6ECEC;overflow:hidden;display:flex">
      <div style="width:40%;background:linear-gradient(90deg,#7BB0A0 0%,#619B8A 100%)"></div>
      <div style="width:60%;background:#E3F5F1"></div>
    </div>
    <div style="display:flex;gap:10px">
      <span class="n" style="flex:1;font-size:12.5px;color:#4A6472">₹8,000 already back</span>
      <span class="n" style="font-size:12.5px;font-weight:600;color:#3F7F6E">₹12,000 now · fully settled</span>
    </div>
  </div>

  <div style="display:flex;align-items:flex-start;gap:10px;margin:0 18px;padding:14px 15px;border-radius:14px;background:#F3F6F5">
    <span style="color:#4A6472;flex:none;margin-top:1px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5v5.5"/><path d="M12 16.6v.1"/><circle cx="12" cy="12" r="8.5"/></svg></span>
    <span style="flex:1;font-size:13px;line-height:1.5;color:#4A6472">This lands in your account as money in — it is not income, so it will not count towards Money in for the month.</span>
  </div>

  <div style="margin-top:auto;padding:20px 18px 26px">
    <button class="el2" style="width:100%;min-height:58px;border-radius:16px;background:radial-gradient(120% 100% at 25% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 60%),linear-gradient(145deg,#2C5063 0%,#1C3541 100%);color:#FFFFFF;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Record it</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
