  <style>

<div style="width:390px;min-height:1000px;display:flex;flex-direction:column;background:#F2F5F0">

      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
        <span style="font-size:15.5px;font-weight:600">I lent money</span>

        <span style="font-size:12.5px;line-height:1.45;color:#4A6472;padding-top:6px;border-top:1px dashed #EAEFF0"><b>Not spending.</b> It leaves your balance and becomes money owed to you.</span>
      </span>

    <button class="el" style="display:flex;align-items:flex-start;gap:13px;padding:16px;border-radius:18px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">

        <span style="font-size:13px;line-height:1.45;color:#4A6472">Their hotel, their ticket, on your card.</span>
        <span style="font-size:12.5px;line-height:1.45;color:#4A6472;padding-top:6px;border-top:1px dashed #EAEFF0"><b>Your spending this month</b>, because it was. Marked to get back.</span>
      </span>
      <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid #C6D2D6;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px"></span>
    </button>
    <button class="el" style="display:flex;align-items:flex-start;gap:13px;padding:16px;border-radius:18px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
      <span style="width:42px;height:42px;border-radius:999px;background:#F7E8F3;display:flex;align-items:center;justify-content:center;color:#8A3574;flex:none"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13"/><path d="M14 5l3 3-3 3"/><path d="M20 16H7"/><path d="M10 13l-3 3 3 3"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">
        <span style="font-size:15.5px;font-weight:600">Something was refunded</span>
        <span style="font-size:13px;line-height:1.45;color:#4A6472">A return, a cancelled booking.</span>
        <span style="font-size:12.5px;line-height:1.45;color:#4A6472;padding-top:6px;border-top:1px dashed #EAEFF0"><b>Undoes spending.</b> Reduces that category in the month it lands.</span>
      </span>
      <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid #C6D2D6;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px"></span>
    </button>
  </div>

  <div class="el" style="margin:20px 18px 0;background:#FFFFFF;border-radius:18px;padding:2px 16px">
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid #EAEFF0">

      <span style="flex:1;font-size:15.5px;font-weight:600">₹10,000</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid #EAEFF0">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">Person</span>

      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid #EAEFF0">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">Book</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Dubai trip</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px;border-bottom:1px solid #EAEFF0">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">From</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">HDFC Savings</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:58px">
      <span style="width:76px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">Date</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Today, 3 Sep</span>
      <span style="color:#5E7885"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </button>
  </div>

  <div style="margin-top:auto;padding:20px 18px 26px">
    <button class="el2" style="width:100%;min-height:58px;border-radius:16px;background:radial-gradient(120% 100% at 25% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 60%),linear-gradient(145deg,#2C5063 0%,#1C3541 100%);color:#FFFFFF;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Save entry</button>
  </div>
</div>
