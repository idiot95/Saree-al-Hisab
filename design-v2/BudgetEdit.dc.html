<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F2F5F0;color:#233D4D;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
    a{color:#3F7F6E;text-decoration:none}
    a:hover{color:#0A5049}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .t{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-0.004em}
    .el{box-shadow:0 1px 2px rgba(40,54,24,0.06),0 10px 26px -14px rgba(40,54,24,0.18)}
    .el2{box-shadow:0 2px 8px rgba(24,32,14,0.12),0 22px 44px -20px rgba(24,32,14,0.40)}
    .sec{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-0.012em;color:#233D4D}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:1240px;display:flex;flex-direction:column;background:#F2F5F0">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 0">
    <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A6472"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 class="t" style="margin:0;font-size:19px">August 2026</h1>
    <button style="min-height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#3F7F6E">Done</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:5px;padding:18px 22px 20px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <span class="eyebrow" style="color:#4A6472">Budgeted</span>
      <span class="n" style="margin-left:auto;font-size:13px;font-weight:600;color:#8A6510">₹93,000 still loose</span>
    </div>
    <span class="n" style="font-size:34px;font-weight:600;letter-spacing:-0.028em;line-height:1.05">₹1,47,000 <span style="font-size:19px;font-weight:500;color:#4A6472">of ₹2,40,000</span></span>
    <div style="height:8px;border-radius:999px;background:#E6ECEC;overflow:hidden;display:flex;margin-top:7px">
      <div style="width:61.3%;background:linear-gradient(90deg,#7BB0A0 0%,#619B8A 100%)"></div>
      <div style="width:38.7%;background:#FDF1D5"></div>
    </div>
  </div>

  <section class="el" style="margin:0 18px 16px;background:#FFFFFF;border-radius:18px;padding:0 16px">
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#EEF6E7;display:flex;align-items:center;justify-content:center;color:#4A7C2A;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5h18"/><path d="M5 20.5V9l7-4.5L19 9v11.5"/><path d="M9.5 20.5v-5h5v5"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">Rent</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹45,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#EEF6E7;display:flex;align-items:center;justify-content:center;color:#4A7C2A;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h7.8a1.5 1.5 0 0 0 1.5-1.2L20 7.5H6"/><circle cx="9.5" cy="19.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="17" cy="19.4" r="1.1" fill="currentColor" stroke="none"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">Groceries</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹25,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#FFEEE4;display:flex;align-items:center;justify-content:center;color:#A9541A;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.5" r="2.8"/><path d="M8 20.5v-4H6.5l2-6a3.5 3.5 0 0 1 7 0l2 6H16v4"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">School fees</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹22,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#FBE8ED;display:flex;align-items:center;justify-content:center;color:#A32F4E;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6.5" r="2.8"/><path d="M8 20.5v-4H6.5l2-6a3.5 3.5 0 0 1 7 0l2 6H16v4"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">Children</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹15,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#F7E8F3;display:flex;align-items:center;justify-content:center;color:#8A3574;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 8h15l-1.2 11.2a1.6 1.6 0 0 1-1.6 1.3H7.3a1.6 1.6 0 0 1-1.6-1.3Z"/><path d="M8.8 8V6.2a3.2 3.2 0 0 1 6.4 0V8"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">Shopping</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹14,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#FFEEE4;display:flex;align-items:center;justify-content:center;color:#A9541A;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5v7a2.5 2.5 0 0 0 5 0v-7"/><path d="M8 10.5v10"/><path d="M17 3.5c-1.7 1-2.5 3-2.5 5.5s.8 3.5 2.5 3.5"/><path d="M17 12.5v8"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">Eating Out</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹10,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#E3F5F1;display:flex;align-items:center;justify-content:center;color:#1C7A63;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 8.5 12 13l9.5-4.5L12 4Z"/><path d="M6.5 10.8V16c0 1.7 2.5 3 5.5 3s5.5-1.3 5.5-3v-5.2"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #EAEFF0">
        <span style="flex:1;font-size:15px;font-weight:600">Utilities</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹10,000</button>
      </div>
    </div>
    <div style="display:flex;gap:13px">
      <span style="margin-top:13px;width:38px;height:38px;border-radius:999px;background:#E4F0F8;display:flex;align-items:center;justify-content:center;color:#215F8C;flex:none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V11l1.8-4.2A2 2 0 0 1 7.6 5.5h8.8a2 2 0 0 1 1.8 1.3L20 11v5.5"/><path d="M3.5 16.5h17"/><circle cx="7.5" cy="18.8" r="1.4"/><circle cx="16.5" cy="18.8" r="1.4"/></svg></span>
      <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:13px 0">
        <span style="flex:1;font-size:15px;font-weight:600">Transport</span>
        <button class="n" style="min-height:44px;display:flex;align-items:center;padding:0 13px;border-radius:12px;background:#F3F6F5;font-size:15px;font-weight:600">₹6,000</button>
      </div>
    </div>
  </section>

  <button style="margin:0 18px 20px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:15px;border:1.5px dashed #BCC9CE;color:#3F7F6E;font-size:14.5px;font-weight:600">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    Add a category
  </button>

  <div style="display:flex;align-items:flex-start;gap:11px;margin:0 18px 12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1px solid #DCE5E7">
    <span style="color:#233D4D;flex:none;margin-top:1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg></span>
    <span style="flex:1;display:flex;flex-direction:column;gap:3px">
      <span style="font-size:14.5px;font-weight:600">September starts from these</span>
      <span style="font-size:13px;line-height:1.45;color:#4A6472">Every month copies the one before it. Change September when you get there and August stays as it was.</span>
    </span>
    <span style="width:50px;height:30px;border-radius:999px;background:#619B8A;display:flex;align-items:center;justify-content:flex-end;padding:3px;flex:none"><span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span></span>
  </div>

  <button style="margin:0 18px 26px;min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:#F3F6F5;color:#4A6472;font-size:14.5px;font-weight:600"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg> Use July's actual spending instead</button>
</div>
</x-dc>

</body>
</html>
