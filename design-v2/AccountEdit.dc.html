<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F2F5F0;color:#233D4D;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
    a{color:#3F7F6E;text-decoration:none}
    a:hover{color:#0A5049}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .t{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-0.004em}
    .el{box-shadow:0 1px 2px rgba(40,54,24,0.06),0 10px 26px -14px rgba(40,54,24,0.18)}
    .el2{box-shadow:0 2px 8px rgba(24,32,14,0.12),0 22px 44px -20px rgba(24,32,14,0.40)}
    .sec{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-0.012em;color:#233D4D}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:1000px;display:flex;flex-direction:column;background:#F2F5F0">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 0">
    <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A6472"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 class="t" style="margin:0;font-size:19px">Edit account</h1>
    <button style="min-height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#3F7F6E">Save</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:18px;padding:22px 20px 0">
    <div style="display:flex;flex-direction:column;gap:7px">
      <span class="eyebrow" style="color:#4A6472">Name</span>
      <div style="min-height:56px;display:flex;align-items:center;padding:0 16px;border-radius:15px;background:#FFFFFF;border:1.5px solid #3F7F6E;font-size:16px;font-weight:600">ICICI Savings</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span class="eyebrow" style="color:#4A6472">What is it for</span>
      <button class="el" style="display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
        <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid ${C.hair};display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px"></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:4px">
          <span style="display:flex;align-items:center;gap:8px">
            <span style="width:26px;height:26px;border-radius:999px;background:#E3F5F1;display:flex;align-items:center;justify-content:center;color:#3F7F6E;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5.5 10.5v7.5"/><path d="M10 10.5v7.5"/><path d="M14 10.5v7.5"/><path d="M18.5 10.5v7.5"/><path d="M3 20.5h18"/></svg></span>
            <span style="font-size:15.5px;font-weight:600">Spending</span>
          </span>
          <span style="font-size:13px;line-height:1.45;color:#4A6472">Every expense from here counts against your budget.</span>
        </span>
      </button>
      <button class="el" style="display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid #3F7F6E;text-align:left">
        <span style="width:24px;height:24px;border-radius:999px;background:#3F7F6E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:4px">
          <span style="display:flex;align-items:center;gap:8px">
            <span style="width:26px;height:26px;border-radius:999px;background:#EEF6E7;display:flex;align-items:center;justify-content:center;color:#4A7C35;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M6.5 10.5 12 5l5.5 5.5"/></svg></span>
            <span style="font-size:15.5px;font-weight:600">Savings</span>
          </span>
          <span style="font-size:13px;line-height:1.45;color:#4A6472">Held out of the budget. Moving money in is never an expense.</span>
        </span>
      </button>
      <button class="el" style="display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
        <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid ${C.hair};display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px"></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:4px">
          <span style="display:flex;align-items:center;gap:8px">
            <span style="width:26px;height:26px;border-radius:999px;background:#EEF0F1;display:flex;align-items:center;justify-content:center;color:#4F5D66;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/></svg></span>
            <span style="font-size:15.5px;font-weight:600">Cash</span>
          </span>
          <span style="font-size:13px;line-height:1.45;color:#4A6472">Same as Spending, for notes in your pocket.</span>
        </span>
      </button>
      <button class="el" style="display:flex;align-items:flex-start;gap:12px;padding:15px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
        <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid ${C.hair};display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px"></span>
        <span style="flex:1;display:flex;flex-direction:column;gap:4px">
          <span style="display:flex;align-items:center;gap:8px">
            <span style="width:26px;height:26px;border-radius:999px;background:#FAE9E2;display:flex;align-items:center;justify-content:center;color:#C2551A;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg></span>
            <span style="font-size:15.5px;font-weight:600">Credit card</span>
          </span>
          <span style="font-size:13px;line-height:1.45;color:#4A6472">A balance you owe. Paying the bill never counts twice.</span>
        </span>
      </button>
    </div>

  <section class="el" style="margin:0 0 8px;background:#FFFFFF;border-radius:18px;padding:0 16px">
    <div style="display:flex;align-items:center;gap:12px;min-height:62px;border-bottom:1px solid #EAEFF0">
      <span style="flex:1;font-size:15px;font-weight:600">Currency</span>
      <span style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#4A6472">₹ INR <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;min-height:62px;border-bottom:1px solid #EAEFF0">
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15px;font-weight:600">Read payment messages</span>
        <span style="font-size:12.5px;color:#4A6472">Suggests entries in your Inbox</span>
      </span>
      <span style="width:50px;height:30px;border-radius:999px;background:#619B8A;display:flex;align-items:center;justify-content:flex-end;padding:3px;flex:none"><span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span></span>
    </div>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:62px">
      <span style="flex:1;font-size:15px;font-weight:600;color:#C2551A">Remove this account</span>
    </button>
  </section>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
