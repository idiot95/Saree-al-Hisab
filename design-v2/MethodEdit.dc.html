<!doctype html>

<x-dc>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F2F5F0;color:#233D4D;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}

    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:1080px;display:flex;flex-direction:column;background:#F2F5F0">

  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 20px 0">
    <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#4A6472"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 class="t" style="margin:0;font-size:19px">New way to pay</h1>
    <button style="min-height:44px;padding:0 6px;display:flex;align-items:center;font-size:14px;font-weight:600;color:#3F7F6E">Save</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:11px;padding:18px 22px 18px">

    <p style="margin:0;font-size:15.5px;line-height:1.5;color:#4A6472">This decides which accounts it is allowed to draw on.</p>
  </div>

  <div style="display:flex;gap:8px;padding:0 18px 20px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none">

    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#FFFFFF;border:1px solid #DCE5E7;color:#4A6472"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg> Card</button>

    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#FFFFFF;border:1px solid #DCE5E7;color:#4A6472"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/></svg> Cash</button>
    <button style="min-height:44px;padding:0 14px;display:flex;align-items:center;gap:7px;border-radius:999px;flex:none;scroll-snap-align:start;white-space:nowrap;font-size:13.5px;font-weight:600;background:#FFFFFF;border:1px solid #DCE5E7;color:#4A6472"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg> Auto-debit</button>
  </div>

  <div class="el" style="margin:0 18px 18px;background:#FFFFFF;border-radius:18px;padding:2px 16px">
    <div style="display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid #EAEFF0">
      <span style="width:88px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">Name</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">GPay</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;min-height:60px">
      <span style="width:88px;flex:none;font-size:13.5px;font-weight:600;color:#4A6472">UPI ID</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">abdeali@okhdfc</span>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:9px;padding:0 18px">
    <span class="eyebrow" style="color:#4A6472;padding:0 2px 2px">Money comes out of</span>
    <button class="el" style="display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid #619B8A;text-align:left">
      <span style="width:40px;height:40px;border-radius:999px;background:#EEF6E7;display:flex;align-items:center;justify-content:center;color:#4A7C2A;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5.5 10.5v7.5"/><path d="M10 10.5v7.5"/><path d="M14 10.5v7.5"/><path d="M18.5 10.5v7.5"/><path d="M3 20.5h18"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15.5px;font-weight:600">HDFC Savings</span>
        <span class="n" style="font-size:12.5px;color:#4A6472">₹2,83,530 · spending</span>
      </span>
      <span style="width:24px;height:24px;border-radius:999px;background:#619B8A;color:#233D4D;display:flex;align-items:center;justify-content:center;flex:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>
    </button>
    <button class="el" style="display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
      <span style="width:40px;height:40px;border-radius:999px;background:#E4F0F8;display:flex;align-items:center;justify-content:center;color:#215F8C;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5.5 10.5v7.5"/><path d="M10 10.5v7.5"/><path d="M14 10.5v7.5"/><path d="M18.5 10.5v7.5"/><path d="M3 20.5h18"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15.5px;font-weight:600">ICICI Savings</span>
        <span class="n" style="font-size:12.5px;color:#4A6472">₹78,200 · spending</span>
      </span>
      <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid #C6D2D6;display:flex;align-items:center;justify-content:center;flex:none"></span>
    </button>
    <button class="el" style="display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;background:#FFFFFF;border:1.5px solid transparent;text-align:left">
      <span style="width:40px;height:40px;border-radius:999px;background:#EEF0F1;display:flex;align-items:center;justify-content:center;color:#4F5D66;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2.5"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/></svg></span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15.5px;font-weight:600">Cash</span>
        <span class="n" style="font-size:12.5px;color:#4A6472">₹18,450 · cash</span>
      </span>
      <span style="width:24px;height:24px;border-radius:999px;border:1.5px solid #C6D2D6;display:flex;align-items:center;justify-content:center;flex:none"></span>
    </button>
    <p style="margin:6px 2px 0;font-size:13px;line-height:1.5;color:#4A6472">Savings accounts are not offered here — money in savings is held out of the budget, so it cannot be a way of paying.</p>
  </div>

  <div style="margin-top:auto;padding:22px 18px 26px">
    <button class="el2" style="width:100%;min-height:58px;border-radius:16px;background:radial-gradient(120% 100% at 25% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 60%),linear-gradient(145deg,#2C5063 0%,#1C3541 100%);color:#FFFFFF;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Save this way to pay</button>
  </div>
</div>
</x-dc>
