<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#F4F1EA;color:#211E1A;font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.35}
    a{color:#0F6B60;text-decoration:none}
    a:hover{color:#0A5049}
    button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
    .n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
    .t{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-0.012em}
    .el{box-shadow:0 1px 2px rgba(58,48,38,0.05),0 10px 26px -14px rgba(58,48,38,0.20)}
    .el2{box-shadow:0 2px 8px rgba(40,32,26,0.10),0 22px 44px -20px rgba(40,32,26,0.45)}
    .sec{margin:0;font-size:16.5px;font-weight:600;letter-spacing:-0.012em;color:#211E1A}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
  </style>
</helmet>

<div style="width:390px;min-height:1300px;display:flex;flex-direction:column;background:#F4F1EA">

  <div class="el2" style="background:radial-gradient(130% 90% at 84% -14%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 62%),linear-gradient(150deg,#158775 0%,#0C5B52 58%,#09443F 100%);color:#FFFFFF;border-radius:0 0 28px 28px;padding:22px 20px 44px;display:flex;flex-direction:column;gap:22px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
      <button style="width:44px;height:44px;margin-left:-10px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.80)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h1 class="t" style="margin:0;font-size:20px;color:#FFFFFF">Add Expense</h1>
      <span style="width:44px;height:44px"></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <span class="eyebrow" style="color:rgba(255,255,255,0.60)">Amount</span>
        <button style="min-height:40px;padding:0 13px;display:flex;align-items:center;gap:6px;border-radius:999px;background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.22);font-size:13.5px;font-weight:600;color:#FFFFFF">
          INR
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
        </button>
      </div>
      <div style="display:flex;align-items:baseline;gap:6px">
        <span class="n" style="font-size:30px;font-weight:500;color:rgba(255,255,255,0.55)">₹</span>
        <span class="n" style="font-size:52px;font-weight:600;letter-spacing:-0.036em;line-height:1.05">2,340</span>
        <span style="width:2px;height:40px;background:rgba(255,255,255,0.85);margin-left:3px;align-self:center"></span>
      </div>
    </div>
  </div>

  <div class="el" style="margin:-28px 18px 16px;background:#FFFFFF;border-radius:20px;padding:2px 18px">
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border-bottom:1px solid #F2EDE4">
      <span style="width:104px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Paid to</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Big Bazaar</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C4BCB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border-bottom:1px solid #F2EDE4">
      <span style="width:104px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Category</span>
      <span style="flex:1;display:flex;align-items:center;gap:9px">
        <span style="width:30px;height:30px;border-radius:999px;background:#E5F0E2;display:flex;align-items:center;justify-content:center;color:#3E7A45;flex:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h7.8a1.5 1.5 0 0 0 1.5-1.2L20 7.5H6"/><circle cx="9.5" cy="19.4" r="1.1" fill="currentColor" stroke="none"/><circle cx="17" cy="19.4" r="1.1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span style="font-size:15.5px;font-weight:600">Groceries</span>
      </span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C4BCB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border-bottom:1px solid #F2EDE4">
      <span style="width:104px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Paid using</span>
      <span style="flex:1;display:flex;align-items:center;gap:9px">
        <span style="width:30px;height:30px;border-radius:999px;background:#DDEDE9;display:flex;align-items:center;justify-content:center;color:#0F6B60;flex:none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M5.5 10.5v7.5"/><path d="M10 10.5v7.5"/><path d="M14 10.5v7.5"/><path d="M18.5 10.5v7.5"/><path d="M3 20.5h18"/></svg>
        </span>
        <span style="font-size:15.5px;font-weight:600">HDFC Savings</span>
      </span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C4BCB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px">
      <span style="width:104px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Date</span>
      <span style="flex:1;font-size:15.5px;font-weight:600">Today, 31 Aug</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C4BCB0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <button onClick="{{ toggleMore }}" style="margin:0 18px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:15px;border:1.5px dashed #D3CBBC;color:#0F6B60;font-size:14.5px;font-weight:600">
    <span>{{ moreLabel }}</span>
    <span style="display:flex;transform: {{ chevronRotate }}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>
    </span>
  </button>

  <sc-if value="{{ more }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:16px;margin:18px 18px 0">

    <div style="display:flex;flex-direction:column;gap:10px">
      <span class="eyebrow" style="color:#948B7F">Who is this for</span>
      <div style="display:flex;gap:3px;padding:3px;background:#EBE6DC;border-radius:999px">
        <button style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:14px;font-weight:600;background:#FFFFFF;color:#211E1A;box-shadow:0 1px 3px rgba(58,48,38,0.14)">Personal</button>
        <button style="flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:14px;font-weight:600;color:#635B51">Household</button>
      </div>
    </div>

    <div class="el" style="background:#FFFFFF;border-radius:18px;padding:2px 18px">
      <button onClick="{{ toggleBack }}" style="display:flex;align-items:center;gap:12px;width:100%;min-height:68px">
        <span style="width:38px;height:38px;border-radius:999px;background:#F6EAC9;display:flex;align-items:center;justify-content:center;color:#8A6A1C;flex:none">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8H7"/><path d="M10 5 7 8l3 3"/><path d="M4 16h13"/><path d="M14 13l3 3-3 3"/></svg>
        </span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15.5px;font-weight:600">Need this money back?</span>
          <span style="font-size:12.5px;color:#948B7F">Reimbursement, loan or shared expense</span>
        </span>
        <sc-if value="{{ back }}" hint-placeholder-val="{{ true }}">
          <span style="width:50px;height:30px;border-radius:999px;background:linear-gradient(145deg,#1D8B7C 0%,#0C5B52 100%);display:flex;align-items:center;justify-content:flex-end;padding:3px;flex:none">
            <span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span>
          </span>
        </sc-if>
        <sc-if value="{{ backOff }}" hint-placeholder-val="{{ false }}">
          <span style="width:50px;height:30px;border-radius:999px;background:#DED7CB;display:flex;align-items:center;justify-content:flex-start;padding:3px;flex:none">
            <span style="width:24px;height:24px;border-radius:999px;background:#FFFFFF"></span>
          </span>
        </sc-if>
      </button>

      <sc-if value="{{ back }}" hint-placeholder-val="{{ true }}">
        <div style="border-top:1px solid #F2EDE4;padding:15px 0 6px;display:flex;flex-direction:column;gap:14px">
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="4">
              <button onClick="{{ k.pick }}" style="{{ k.style }}">{{ k.label }}</button>
            </sc-for>
          </div>
          <div style="display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid #F2EDE4">
            <span style="width:122px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">From whom</span>
            <span style="flex:1;font-size:15.5px;font-weight:600">Ahmed Raza</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid #F2EDE4">
            <span style="width:122px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Amount expected</span>
            <span class="n" style="flex:1;font-size:15.5px;font-weight:600">₹2,340</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid #F2EDE4">
            <span style="width:122px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Expected by</span>
            <span style="flex:1;font-size:15.5px;font-weight:600">15 Sep 2026</span>
          </div>
        </div>
      </sc-if>
    </div>

    <div class="el" style="background:#FFFFFF;border-radius:18px;padding:2px 18px">
      <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border-bottom:1px solid #F2EDE4">
        <span style="width:38px;height:38px;border-radius:999px;background:#EDE5F4;display:flex;align-items:center;justify-content:center;color:#7A4C9E;flex:none">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12v17l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4-2 1.4Z"/><path d="M9 8.5h6"/><path d="M9 12.5h6"/></svg>
        </span>
        <span style="flex:1;font-size:15.5px;font-weight:600;color:#0F6B60">Attach receipt</span>
      </button>
      <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border-bottom:1px solid #F2EDE4">
        <span style="width:104px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Notes</span>
        <span style="flex:1;font-size:15.5px;color:#B5ADA1">Add a note</span>
      </button>
      <button style="display:flex;align-items:center;gap:12px;width:100%;min-height:64px">
        <span style="width:104px;flex:none;font-size:13.5px;font-weight:600;color:#948B7F">Tags</span>
        <span style="flex:1;font-size:15.5px;color:#B5ADA1">Add tags</span>
      </button>
    </div>

  </div>
  </sc-if>

  <div style="margin-top:auto;padding:20px 18px 26px">
    <button class="el2" style="width:100%;min-height:58px;border-radius:16px;background:radial-gradient(120% 100% at 25% 0%, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0) 60%),linear-gradient(145deg,#17877A 0%,#0B5049 100%);color:#FFFFFF;font-size:16.5px;font-weight:600;display:flex;align-items:center;justify-content:center">Save Expense</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { more: false, back: false, kind: 'Reimbursement' };
  }
  renderVals() {
    var self = this;
    var on = 'min-height:44px;padding:0 15px;display:flex;align-items:center;border-radius:999px;font-size:13.5px;font-weight:600;background:linear-gradient(145deg,#1D8B7C 0%,#0C5B52 100%);color:#FFFFFF';
    var off = 'min-height:44px;padding:0 15px;display:flex;align-items:center;border-radius:999px;font-size:13.5px;font-weight:600;background:#F1EDE4;color:#635B51';
    var kinds = ['Reimbursement', 'Loan given', 'Shared expense', 'Other'].map(function (k) {
      return {
        label: k,
        style: self.state.kind === k ? on : off,
        pick: function () { self.setState({ kind: k }); }
      };
    });
    return {
      more: this.state.more,
      back: this.state.back,
      backOff: !this.state.back,
      kinds: kinds,
      moreLabel: this.state.more ? 'Fewer options' : 'More options',
      chevronRotate: this.state.more ? 'rotate(180deg)' : 'rotate(0deg)',
      toggleMore: function () { self.setState({ more: !self.state.more }); },
      toggleBack: function () { self.setState({ back: !self.state.back }); }
    };
  }
}
</script>
</body>
</html>
